name: Sync published APK release to Nexvio update feed

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to sync, for example V1.0.448'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-update-feed:
    if: github.event_name == 'workflow_dispatch' || (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    steps:
      - name: Update the Nexvio website feed
        uses: actions/github-script@v7
        env:
          MAIN_REPO_TOKEN: ${{ secrets.NEXVIO_MAIN_REPO_TOKEN }}
        with:
          script: |
            let release = context.payload.release;
            if (context.eventName === 'workflow_dispatch') {
              const response = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: context.payload.inputs?.tag || context.payload.inputs?.tag_name
              });
              release = response.data;
            }
            const tag = release.tag_name;
            const version = tag.replace(/^[vV]/, '');

            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              core.setFailed(`Unexpected Nexvio release tag: ${tag}`);
              return;
            }

            const apk = release.assets.find(asset => asset.name === 'app-debug.apk')
              || release.assets.find(asset => asset.name.toLowerCase().endsWith('.apk'));

            if (!apk) {
              core.setFailed('No APK asset was attached to this release.');
              return;
            }

            if (!process.env.MAIN_REPO_TOKEN) {
              core.setFailed('Missing repository secret NEXVIO_MAIN_REPO_TOKEN.');
              return;
            }

            const owner = 'nexarion666-png';
            const repo = 'Nexvio-';
            const path = 'updates-site/latest.json';
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': `Bearer ${process.env.MAIN_REPO_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28'
            };
            const versionCode = Number(version.split('.').pop());
            const feed = {
              version,
              versionCode,
              downloadUrl: apk.browser_download_url,
              releaseNotes: (release.body || '').trim() || `Nexvio ${version} update.`
            };

            const currentResponse = await fetch(`${apiUrl}?ref=main`, { headers });
            let sha;
            if (currentResponse.ok) {
              const current = await currentResponse.json();
              sha = current.sha;
            } else if (currentResponse.status !== 404) {
              throw new Error(`Could not read main website feed (${currentResponse.status}): ${await currentResponse.text()}`);
            }

            const updateResponse = await fetch(apiUrl, {
              method: 'PUT',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                message: `Update Nexvio update feed to ${version}`,
                content: Buffer.from(JSON.stringify(feed, null, 2)).toString('base64'),
                branch: 'main',
                ...(sha ? { sha } : {})
              })
            });
            if (!updateResponse.ok) {
              throw new Error(`Could not update main website feed (${updateResponse.status}): ${await updateResponse.text()}`);
            }
            core.notice(`Update feed now points to Nexvio ${version}.`);
